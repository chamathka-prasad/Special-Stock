<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - SpecialStock AI</title>
    <meta name="csrf-token" content="">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <header class="header">
        <nav class="nav-container">
            <a href="index.html" class="logo">SpecialStock AI</a>
            <ul class="nav-menu" id="nav-menu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="search.html" class="nav-link">Browse</a></li>
                <li class="nav-item-user hidden"><a href="upload.html" class="nav-link">Upload</a></li>
                <li class="nav-item-user hidden"><a href="#" class="nav-link" id="dashboard-link">Dashboard</a></li>
                <li class="nav-item-guest"><a href="login.html" class="nav-link">Login</a></li>
                <li class="nav-item-guest"><a href="register.html" class="nav-link">Register</a></li>
                <li class="nav-item-user hidden"><a href="profile.html" class="nav-link" id="user-name">Profile</a></li>
                <li class="nav-item-user hidden"><button id="logout-btn" class="nav-link" style="background: none; border: none; cursor: pointer;">Logout</button></li>
                <li><a href="cart.html" class="nav-link">Cart (<span class="cart-count">0</span>)</a></li>
            </ul>
        </nav>
    </header>

    <main class="container" style="padding: 2rem 0;">
        <!-- Search Section -->
        <section class="mb-4">
            <div class="search-container">
                <form id="search-form">
                    <input type="text" 
                           id="search-input" 
                           name="query" 
                           class="search-input" 
                           placeholder="Search for photos, videos, and more...">
                    <button type="submit" class="search-button">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                        </svg>
                    </button>
                </form>
            </div>
        </section>

        <!-- Filters Section -->
        <section class="mb-4">
            <div class="card" style="padding: 1rem;">
                <div class="grid grid-2" style="gap: 2rem;">
                    <div>
                        <h3 class="mb-2">Filters</h3>
                        <div class="flex gap-4 flex-wrap">
                            <div>
                                <label class="form-label">Type:</label>
                                <select id="type-filter" class="form-select" style="width: auto;">
                                    <option value="">All</option>
                                    <option value="image">Images</option>
                                    <option value="video">Videos</option>
                                </select>
                            </div>
                            <div>
                                <label class="form-label">Price:</label>
                                <select id="price-filter" class="form-select" style="width: auto;">
                                    <option value="">All</option>
                                    <option value="free">Free</option>
                                    <option value="paid">Paid</option>
                                </select>
                            </div>
                            <div>
                                <label class="form-label">Sort by:</label>
                                <select id="sort-filter" class="form-select" style="width: auto;">
                                    <option value="newest">Newest</option>
                                    <option value="oldest">Oldest</option>
                                    <option value="popular">Most Downloaded</option>
                                    <option value="price_low">Price: Low to High</option>
                                    <option value="price_high">Price: High to Low</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div>
                        <h3 class="mb-2">Quick Categories</h3>
                        <div class="flex gap-2 flex-wrap">
                            <button class="btn btn-outline category-btn" data-category="business">Business</button>
                            <button class="btn btn-outline category-btn" data-category="technology">Technology</button>
                            <button class="btn btn-outline category-btn" data-category="nature">Nature</button>
                            <button class="btn btn-outline category-btn" data-category="people">People</button>
                            <button class="btn btn-outline category-btn" data-category="abstract">Abstract</button>
                            <button class="btn btn-outline category-btn" data-category="food">Food</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Search Results -->
        <section>
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h2 id="results-title">Browse All Content</h2>
                    <p id="results-count" style="color: #666;">Loading...</p>
                </div>
                <button id="clear-filters-btn" class="btn btn-outline" style="display: none;">Clear Filters</button>
            </div>

            <div id="search-results" class="grid grid-4">
                <div class="text-center" style="grid-column: 1 / -1; padding: 2rem;">
                    <div class="spinner" style="margin: 0 auto;"></div>
                    <p>Loading content...</p>
                </div>
            </div>

            <!-- Load More Button -->
            <div class="text-center mt-4">
                <button id="load-more-btn" class="btn btn-outline" style="display: none;">Load More</button>
            </div>
        </section>
    </main>

    <script src="assets/js/utils.js"></script>
    <script src="search.js"></script>
</body>
</html>
