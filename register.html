<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SpecialStock AI</title>
    <meta name="csrf-token" content="">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <header class="header">
        <nav class="nav-container">
            <a href="index.html" class="logo">SpecialStock AI</a>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="login.html" class="nav-link">Login</a></li>
                <li><a href="register.html" class="nav-link">Register</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <div class="form-container">
            <h1 class="text-center mb-4">Create Your Account</h1>
            
            <form id="registerForm">
                <div class="form-group">
                    <label for="firstName" class="form-label">First Name</label>
                    <input type="text" id="firstName" name="first_name" class="form-input" required>
                </div>

                <div class="form-group">
                    <label for="lastName" class="form-label">Last Name</label>
                    <input type="text" id="lastName" name="last_name" class="form-input" required>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" name="email" class="form-input" required>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-input" required>
                    <div id="passwordStrength" class="mt-2 text-sm"></div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirm_password" class="form-input" required>
                </div>

                <div class="form-group">
                    <label for="role" class="form-label">I want to:</label>
                    <select id="role" name="role" class="form-select" required>
                        <option value="">Select an option</option>
                        <option value="buyer">Buy stock media</option>
                        <option value="seller">Sell my content</option>
                        <option value="buyer">Both buy and sell</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="flex items-center gap-2">
                        <input type="checkbox" id="agreeTerms" name="agree_terms" required>
                        I agree to the <a href="#" class="text-black underline">Terms of Service</a> and <a href="#" class="text-black underline">Privacy Policy</a>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary w-full">Create Account</button>
            </form>

            <div class="text-center mt-4">
                <p>Or register with:</p>
                <div class="flex gap-2 justify-center mt-2">
                    <button id="googleRegister" class="btn btn-outline">
                        <svg width="18" height="18" viewBox="0 0 24 24" class="inline mr-2">
                            <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                            <path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                        </svg>
                        Google
                    </button>
                </div>
            </div>

            <div class="text-center mt-4">
                <p>Already have an account? <a href="login.html" class="text-black underline">Sign in here</a></p>
            </div>
        </div>
    </main>

    <script src="assets/js/utils.js"></script>
    <script src="register.js"></script>
</body>
</html>
